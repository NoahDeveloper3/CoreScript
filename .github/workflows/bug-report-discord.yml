name: Send Issue to Discord

on:
  issues:
    types: [opened]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Post bug report to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import urllib.request

          title = (os.environ.get("ISSUE_TITLE") or "").replace("```", "'''")[:250]
          body = (os.environ.get("ISSUE_BODY") or "(No details provided)").replace("```", "'''")[:1200]
          user = os.environ.get("ISSUE_USER") or "unknown"
          url = os.environ.get("ISSUE_URL") or ""

          content = (
              "```\n"
              "CoreScript bug report\n\n"
              f"From: {user}\n"
              f"Title: {title}\n\n"
              f"{body}\n"
              "```\n"
              f"{url}"
          )[:2000]

          payload = json.dumps({
              "content": content,
              "allowed_mentions": {"parse": []}
          }).encode("utf-8")

          req = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "CoreScript-GitHub-Action/1.0"
              },
              method="POST"
          )
          with urllib.request.urlopen(req, timeout=10) as resp:
              if resp.status not in (200, 204):
                  raise RuntimeError(f"Unexpected status: {resp.status}")
          EOF
